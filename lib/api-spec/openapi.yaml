openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: AI chat operations
  - name: chat
    description: Chat history operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/chat:
    post:
      operationId: streamGeminiChat
      tags: [gemini]
      summary: Stream an AI chat response
      description: Streams a response to the supplied chat history as server-sent events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Server-sent event stream with response text chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Load the current browser chat history
      responses:
        "200":
          description: Saved chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistory"
        "503":
          description: Supabase chat storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chat/history/new:
    post:
      operationId: startNewChat
      tags: [chat]
      summary: Start a new browser chat session
      responses:
        "201":
          description: Empty chat history for the new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistory"
        "503":
          description: Chat session signing is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    ChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/ChatTurn"
      required:
        - messages
    ChatHistory:
      type: object
      properties:
        messages:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/ChatTurn"
      required:
        - messages
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

